[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moving-loads"
version = "0.1.0"
description = "Structural engineering library for moving load analysis on beams"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
llm = [
    "anthropic>=1.0",
]

[project.scripts]
offerings = "email_offerings.cli:main"

[tool.setuptools]
packages = ["moving_loads", "email_offerings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["moving_loads", "email_offerings"]

[tool.coverage.report]
show_missing = true
fail_under = 0
